name: Update public and private profile stats

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check private-repository token
        env:
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        run: |
          if [ -z "$PROFILE_READ_TOKEN" ]; then
            echo "::error::Add the read-only PROFILE_READ_TOKEN Actions secret. Existing combined cards are preserved. See docs/profile-stats.md."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned
      - name: Generate aggregate cards
        env:
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
          PROFILE_MIN_PRIVATE_REPOS: '6'
        run: python3 scripts/update_profile.py
      - name: Verify generated cards
        run: python3 -m unittest discover -s tests -v
      - name: Commit updated aggregates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/stats-*.svg profile/languages-*.svg profile/summary.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update aggregate public and private profile stats"
            git push
          fi
